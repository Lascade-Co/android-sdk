name: Build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: Build and test
    # macOS so the iOS targets compile too.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build and test
        run: ./gradlew build
